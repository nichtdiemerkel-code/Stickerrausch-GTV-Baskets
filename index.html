<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

    .logo-big {

    .bottom-img {

    .subtitle {
      color: gray;

    }

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
      authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
      projectId: "gtv-baskets-stickertausch",
      storageBucket: "gtv-baskets-stickertausch.firebasestorage.app",
      messagingSenderId: "533155128539",
      appId: "1:533155128539:web:c309efb7827301617a98fe",
      databaseURL: "https://gtv-baskets-stickertausch-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function sortiereListe(text) {
      return text
        .split(",")
        .map(x => parseInt(x.trim()))
        .filter(x => !isNaN(x))
        .sort((a, b) => a - b);
    }

    function safeName(name) {
      return name.replace(/[^a-zA-Z0-9]/g, "_");
    }

    window.saveData = function () {
      const name = document.getElementById("name").value;
      const key = safeName(name);

      const habe = sortiereListe(document.getElementById("habe").value);
      const suche = sortiereListe(document.getElementById("suche").value);

      set(ref(db, "users/" + key), {
        name,
        habe,
        suche
      });

      alert("Gespeichert!");
    };

    window.loadMyData = function () {
      const name = document.getElementById("name").value;
      const key = safeName(name);

      onValue(ref(db, "users/" + key), (snapshot) => {
        const data = snapshot.val();

        if (!data) {
          alert("Keine Daten gefunden!");
          return;
        }

        document.getElementById("habe").value = data.habe.join(",");
        document.getElementById("suche").value = data
