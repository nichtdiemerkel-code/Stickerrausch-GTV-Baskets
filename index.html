<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<style>
body { font-family: Arial; background: #f4f6f8; padding:20px; text-align:center;}
.container { max-width:420px; margin:auto; background:white; padding:20px; border-radius:16px;}
input, button { width:100%; padding:12px; margin:6px 0; border-radius:10px;}
button { background:#e30613; color:white; border:none;}
.match { background:#e8f4ff; padding:10px; margin-top:8px; border-radius:8px;}
</style>
</head>

<body>

<div class="container">

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Name">
<input id="habe" placeholder="Habe (z.B. 1,2,3)">
<input id="suche" placeholder="Suche (z.B. 4,5,6)">

<button onclick="speichern()">Speichern</button>
<button onclick="laden()">Meine Daten laden</button>
<button onclick="matches()">Matches anzeigen</button>

<div id="output"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
  authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
  projectId: "gtv-baskets-stickertausch",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function parse(text){
  return text.split(",").map(x=>x.trim()).filter(x=>x!=="");
}

window.speichern = async ()=>{
  const name = document.getElementById("name").value.trim();
  const habe = parse(document.getElementById("habe").value);
  const suche = parse(document.getElementById("suche").value);

  await setDoc(doc(db,"users",name),{habe,suche});
  alert("Gespeichert");
};

window.laden = async ()=>{
  const name = document.getElementById("name").value.trim();
  const d = await getDoc(doc(db,"users",name));
  if(d.exists()){
    document.getElementById("habe").value = (d.data().habe||[]).join(",");
    document.getElementById("suche").value = (d.data().suche||[]).join(",");
  }
};

window.matches = async ()=>{
  const meinName = document.getElementById("name").value.trim();
  const meineSuche = parse(document.getElementById("suche").value);
  const meinHabe = parse(document.getElementById("habe").value);

  const snap = await getDocs(collection(db,"users"));
  let html="";

  snap.forEach(docSnap=>{
    const user = docSnap.data();
    const name = docSnap.id;

    if(name===meinName) return;

    const hatMeine = (user.habe||[]).some(x=>meineSuche.includes(x));
    const ichHabeSeine = meinHabe.some(x=>(user.suche||[]).includes(x));

    if(hatMeine || ichHabeSeine){
      html += `<div class="match"><b>${name}</b> passt zu dir</div>`;
    }
  });

  document.getElementById("output").innerHTML = html || "Keine Matches";
};
</script>

</body>
</html>
