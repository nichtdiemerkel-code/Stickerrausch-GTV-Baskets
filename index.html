<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sticker Tauschbörse</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      background: red;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .match {
      background: #e6eef6;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
    }

    img {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="card">

  <img src="https://upload.wikimedia.org/wikipedia/de/thumb/3/3b/GTV_Baskets_Logo.svg/512px-GTV_Baskets_Logo.svg.png">

  <h2>Sticker Tauschbörse</h2>

  <input id="name" placeholder="Name (z. B. Anna)">
  <input id="habe" placeholder="Habe (z. B. 1,5,23)">
  <input id="suche" placeholder="Suche (z. B. 8,12,44)">

  <button onclick="speichern()">Speichern</button>
  <button onclick="laden()">Meine Daten laden</button>
  <button onclick="matches()">Matches anzeigen</button>

  <div id="output"></div>

  <img src="https://images.unsplash.com/photo-1606813909025-c69b9a1b6c2f">
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDemoKey123456",
  authDomain: "demo-project.firebaseapp.com",
  projectId: "demo-project"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function parse(str){
  return str.split(",").map(x => parseInt(x.trim())).filter(x => !isNaN(x));
}

function speichern(){
  const name = document.getElementById("name").value;
  const habe = parse(document.getElementById("habe").value);
  const suche = parse(document.getElementById("suche").value);

  db.collection("users").doc(name).set({
    name,
    habe,
    suche
  });

  alert("Gespeichert!");
}

async function laden(){
  const name = document.getElementById("name").value;

  const doc = await db.collection("users").doc(name).get();

  if(doc.exists){
    const data = doc.data();

    document.getElementById("habe").value = data.habe.join(", ");
    document.getElementById("suche").value = data.suche.join(", ");
  }
}

async function matches(){
  const myName = document.getElementById("name").value;
  const meineSuche = parse(document.getElementById("suche").value);

  const snapshot = await db.collection("users").get();

  let html = "";

  snapshot.forEach(doc => {
    const data = doc.data();
    const otherName = data.name;

    if(otherName === myName) return;

    const habe = data.habe || [];

    const gemeinsame = habe.filter(x => meineSuche.includes(x));

    if(gemeinsame.length > 0){
      html += `<div class="match"><b>${otherName}</b> hat deine Sticker: ${gemeinsame.join(", ")}</div>`;
    }
  });

  document.getElementById("output").innerHTML = html || "Keine Matches";
}
</script>

</body>
</html>
