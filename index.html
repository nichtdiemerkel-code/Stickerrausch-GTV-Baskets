<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tausch</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body { font-family: Arial; max-width: 500px; margin: auto; padding: 20px; }
input, button { width: 100%; padding: 10px; margin: 5px 0; }
.match { background: #e0f0ff; padding: 5px; margin: 5px 0; }
</style>

</head>
<body>

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Dein Name">
<input id="habe" placeholder="Habe (z.B. 1,2,3)">
<input id="suche" placeholder="Suche (z.B. 4,5,6)">

<button onclick="speichern()">Speichern</button>
<button onclick="anzeigen()">Matches anzeigen</button>

<div id="output"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
  authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
  databaseURL: "https://gtv-baskets-stickertausch-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gtv-baskets-stickertausch",
  storageBucket: "gtv-baskets-stickertausch.firebasestorage.app",
  messagingSenderId: "533155128539",
  appId: "1:533155128539:web:c309efb7827301617a98fe"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function parseListe(text) {
  return text.split(",")
    .map(x => parseInt(x.trim()))
    .filter(x => !isNaN(x))
    .sort((a, b) => a - b);
}

function speichern() {
  let name = document.getElementById("name").value;
  let habe = parseListe(document.getElementById("habe").value);
  let suche = parseListe(document.getElementById("suche").value);

  if (!name) return alert("Name fehlt!");

  db.ref("users/" + name).set({
    habe: habe,
    suche: suche
  });

  alert("Gespeichert!");
}

function anzeigen() {
  let meineSuche = parseListe(document.getElementById("suche").value);
  let meinName = document.getElementById("name").value;

  db.ref("users").once("value", snapshot => {
    let users = snapshot.val();
    let html = "";

    for (let name in users) {
      if (name === meinName) continue;

      let user = users[name];
      let matches = meineSuche.filter(n => user.habe.includes(n));

      if (matches.length > 0) {
        html += `<div class="match"><b>${name}</b> hat: ${matches.join(", ")}</div>`;
      }
    }

    document.getElementById("output").innerHTML = html || "Keine Matches gefunden.";
  });
}

</script>

</body>
</html>
