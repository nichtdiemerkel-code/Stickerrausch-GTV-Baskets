<!DOCTYPE html>
<html>
<head>
  <title>Sticker Tausch Verein</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { padding: 10px; margin: 5px; width: 100%; }
  </style>
</head>
<body>

<h2>Sticker Tausch Verein</h2>

<input id="name" placeholder="Dein Name">
<input id="habe" placeholder="Habe (z.B. 1,2,3)">
<input id="suche" placeholder="Suche (z.B. 4,5,6)">

<button onclick="anzeigen()">Eingaben anzeigen</button>

<div id="output"></div>

<script>
function anzeigen() {
  let name = document.getElementById("name").value;
  let habe = document.getElementById("habe").value;
  let suche = document.getElementById("suche").value;

  document.getElementById("output").innerHTML =
    "<b>" + name + "</b><br>Habe: " + habe + "<br>Suche: " + suche;
}
</script>

</body>
</html>
