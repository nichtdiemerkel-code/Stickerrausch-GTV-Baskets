<script>
async function zeigeMatches() {
  const snapshot = await db.collection("users").get();
  const users = [];

  snapshot.forEach(doc => {
    users.push(doc.data());
  });

  let html = "";

  users.forEach(userA => {
    users.forEach(userB => {
      if (userA.name !== userB.name) {

        const habeA = userA.habe || [];
        const sucheA = userA.suche || [];

        const habeB = userB.habe || [];
        const sucheB = userB.suche || [];

        // 🔥 WICHTIG: ALLES in Zahlen umwandeln
        const habeANum = habeA.map(x => Number(x));
        const sucheANum = sucheA.map(x => Number(x));
        const habeBNum = habeB.map(x => Number(x));
        const sucheBNum = sucheB.map(x => Number(x));

        const match =
          sucheANum.some(x => habeBNum.includes(x)) &&
          sucheBNum.some(x => habeANum.includes(x));

        if (match) {
          html += `<div class="match"><b>${userA.name}</b> ↔ <b>${userB.name}</b></div>`;
        }
      }
    });
  });

  document.getElementById("output").innerHTML =
    html || "Keine Matches";
}
</script>
