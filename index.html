<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 16px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  background: #e30613;
  color: white;
}

.match {
  background: #e8f4ff;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Name">
<input id="habe" placeholder="Habe (1,5,23)">
<input id="suche" placeholder="Suche (8,12,44)">

<button onclick="speichern()">Speichern</button>
<button onclick="laden()">Meine Daten laden</button>
<button onclick="matches()">Matches anzeigen</button>

<div id="output"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
  authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
  projectId: "gtv-baskets-stickertausch"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function parse(text){
  return text.split(",").map(x => parseInt(x.trim())).filter(x => !isNaN(x));
}

async function speichern(){
  const name = document.getElementById("name").value.trim();
  const habe = parse(document.getElementById("habe").value);
  const suche = parse(document.getElementById("suche").value);

  await db.collection("users").doc(name).set({
    name,
    habe,
    suche
  });

  alert("Gespeichert");
}

async function laden(){
  const name = document.getElementById("name").value.trim();

  const doc = await db.collection("users").doc(name).get();

  if(doc.exists){
    const data = doc.data();
    document.getElementById("habe").value = (data.habe || []).join(", ");
    document.getElementById("suche").value = (data.suche || []).join(", ");
  } else {
    alert("Keine Daten gefunden");
  }
}

async function matches(){
  const name = document.getElementById("name").value.trim();

  const myDoc = await db.collection("users").doc(name).get();

  if(!myDoc.exists){
    alert("User nicht gefunden");
    return;
  }

  const meineSuche = myDoc.data().suche || [];

  const snapshot = await db.collection("users").get();

  let html = "";

  snapshot.forEach(doc => {
    if(doc.id === name) return;

    const user = doc.data();
    const gemeinsame = (user.habe || []).filter(x => meineSuche.includes(x));

    if(gemeinsame.length > 0){
      html += `<div class="match"><b>${doc.id}</b>: ${gemeinsame.join(", ")}</div>`;
    }
  });

  document.getElementById("output").innerHTML = html || "Keine Matches";
}
</script>

</body>
</html>
