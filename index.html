<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
}

button {
  background: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
}

.match {
  background: #e9f5ff;
  padding: 8px;
  margin: 6px 0;
  border-radius: 5px;
}
</style>
</head>
<body>

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Dein Name">
<input id="habe" placeholder="Ich habe (z.B. 1,2,3)">
<input id="suche" placeholder="Ich suche (z.B. 4,5,6)">

<button onclick="speichern()">Eintragen</button>
<button onclick="anzeigen()">Matches anzeigen</button>

<div id="output"></div>

<script>

let alle = JSON.parse(localStorage.getItem("stickerListe")) || [];

function liste(text) {
  return text.split(",")
    .map(x => parseInt(x.trim()))
    .filter(x => !isNaN(x))
    .sort((a,b)=>a-b);
}

function speichern() {
  let name = document.getElementById("name").value;
  let habe = liste(document.getElementById("habe").value);
  let suche = liste(document.getElementById("suche").value);

  if (!name) {
    alert("Bitte Namen eingeben");
    return;
  }

  let idx = alle.findIndex(p => p.name === name);

  if (idx !== -1) {
    alle[idx] = { name, habe, suche };
  } else {
    alle.push({ name, habe, suche });
  }

  localStorage.setItem("stickerListe", JSON.stringify(alle));

  alert("Gespeichert!");
}

function anzeigen() {
  let meinName = document.getElementById("name").value;
  let meineSuche = liste(document.getElementById("suche").value);

  let html = "";

  alle.forEach(p => {
    if (p.name === meinName) return;

    let matches = meineSuche.filter(n => p.habe.includes(n));

    if (matches.length > 0) {
      html += `<div class="match"><b>${p.name}</b> hat: ${matches.join(", ")}</div>`;
    }
  });

  document.getElementById("output").innerHTML = html || "Keine Matches gefunden";
}

</script>

</body>
</html>
