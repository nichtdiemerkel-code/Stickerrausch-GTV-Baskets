<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
    authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
    projectId: "gtv-baskets-stickertausch",
    storageBucket: "gtv-baskets-stickertausch.firebasestorage.app",
    messagingSenderId: "533155128539",
    appId: "1:533155128539:web:c309efb7827301617a98fe"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.speichern = async function () {
    const name = document.getElementById("name").value;
    const habe = document.getElementById("habe").value;
    const suche = document.getElementById("suche").value;

    await addDoc(collection(db, "tausche"), {
      name,
      habe,
      suche
    });

    alert("Gespeichert!");
  };

  // 🔥 NEU: eigene Daten laden
  window.meineDatenLaden = async function () {
    const name = document.getElementById("name").value;

    const querySnapshot = await getDocs(collection(db, "tausche"));

    let gefunden = false;

    querySnapshot.forEach((doc) => {
      const data = doc.data();

      if (data.name === name) {
        document.getElementById("habe").value = data.habe;
        document.getElementById("suche").value = data.suche;
        gefunden = true;
      }
    });

    if (!gefunden) {
      alert("Keine Daten gefunden");
    }
  };

  window.matchesAnzeigen = async function () {
    const querySnapshot = await getDocs(collection(db, "tausche"));
    let daten = [];

    querySnapshot.forEach((doc) => {
      daten.push(doc.data());
    });

    let output = "";

    daten.forEach(a => {
      daten.forEach(b => {
        if (a !== b) {
          let habeA = a.habe.split(",").map(x => x.trim());
          let sucheA = a.suche.split(",").map(x => x.trim());

          habeA.forEach(num => {
            if (b.suche.includes(num)) {
              output += `<div class="match">${a.name} hat ${num} für ${b.name}</div>`;
            }
          });

          sucheA.forEach(num => {
            if (b.habe.includes(num)) {
              output += `<div class="match">${a.name} sucht ${num} von ${b.name}</div>`;
            }
          });
        }
      });
    });

    document.getElementById("matches").innerHTML = output || "Keine Matches gefunden";
  };
</script>

<style>
body {
  font-family: Arial;
  max-width: 500px;
  margin: auto;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

.match {
  background: #e0f0ff;
  padding: 5px;
  margin: 5px 0;
}

.logo {
  width: 80px;
  margin: 10px auto;
}

.stickerbild {
  width: 180px;
  max-width: 100%;
  margin-top: 30px;
}
</style>

</head>

<body>

<img src="images (1).png" class="logo">

<h2>Sticker Tauschbörse</h2>
<p>GTV Baskets</p>

<input id="name" placeholder="Vorname + Anfangsbuchstabe (z.B. Anna M)">
<input id="habe" placeholder="Habe (z.B. 1,2,3)">
<input id="suche" placeholder="Suche (z.B. 5,8,10)">

<button onclick="speichern()">Speichern</button>

<!-- 🔥 WIEDER DA -->
<button onclick="meineDatenLaden()">Meine Daten laden</button>

<button onclick="matchesAnzeigen()">Matches anzeigen</button>

<div id="matches"></div>

<img src="PXL_20260420_065327386.jpg" class="stickerbild">

</body>
</html>
