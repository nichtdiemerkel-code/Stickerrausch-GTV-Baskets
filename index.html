<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 16px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  background: #e30613;
  color: white;
  border: none;
}

.match {
  background: #e8f4ff;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Name">
<input id="habe" placeholder="Habe (z.B. 1,5,23)">
<input id="suche" placeholder="Suche (z.B. 8,12,44)">

<button onclick="speichern()">Speichern</button>
<button onclick="laden()">Laden</button>
<button onclick="matches()">Matches</button>

<div id="output"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
  authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
  projectId: "gtv-baskets-stickertausch"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function parseListe(text){
  return text.split(",").map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));
}

function speichern(){
  const name = document.getElementById("name").value.trim();
  const habe = parseListe(document.getElementById("habe").value);
  const suche = parseListe(document.getElementById("suche").value);

  db.collection("users").doc(name).set({habe, suche});
  alert("Gespeichert");
}

async function laden(){
  const name = document.getElementById("name").value.trim();
  const doc = await db.collection("users").doc(name).get();

  if(doc.exists){
    const data = doc.data();
    document.getElementById("habe").value = data.habe.join(",");
    document.getElementById("suche").value = data.suche.join(",");
  } else {
    alert("Nicht gefunden");
  }
}

async function matches(){
  const meinName = document.getElementById("name").value.trim();
  const meineSuche = parseListe(document.getElementById("suche").value);

  const snapshot = await db.collection("users").get();
  let html = "";

  snapshot.forEach(doc=>{
    const user = doc.data();
    const name = doc.id;

    if(name === meinName) return;

    if(user.habe.some(x=>meineSuche.includes(x))){
      html += `<div class="match">${name} hat deine Sticker</div>`;
    }
  });

  document.getElementById("output").innerHTML = html || "Keine Matches";
}
</script>

</body>
</html>
