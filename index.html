<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sticker Tauschbörse</title>

  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: auto;
      padding: 10px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    .match {
      background: #e0f0ff;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-big {
      width: 140px;
      border-radius: 10px;
    }

    .bottom-img {
      width: 120px;
      display: block;
      margin: 30px auto;
    }

    .subtitle {
      color: gray;
      font-size: 14px;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
      authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
      projectId: "gtv-baskets-stickertausch",
      storageBucket: "gtv-baskets-stickertausch.firebasestorage.app",
      messagingSenderId: "533155128539",
      appId: "1:533155128539:web:c309efb7827301617a98fe",
      databaseURL: "https://gtv-baskets-stickertausch-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function sortiereListe(text) {
      return text
        .split(",")
        .map(x => parseInt(x.trim()))
        .filter(x => !isNaN(x))
        .sort((a, b) => a - b);
    }

    function safeName(name) {
      return name.replace(/[^a-zA-Z0-9]/g, "_");
    }

    window.saveData = function () {
      const name = document.getElementById("name").value;
      const key = safeName(name);

      const habe = sortiereListe(document.getElementById("habe").value);
      const suche = sortiereListe(document.getElementById("suche").value);

      set(ref(db, "users/" + key), {
        name,
        habe,
        suche
      });

      alert("Gespeichert!");
    };

    window.loadMyData = function () {
      const name = document.getElementById("name").value;
      const key = safeName(name);

      onValue(ref(db, "users/" + key), (snapshot) => {
        const data = snapshot.val();

        if (!data) {
          alert("Keine Daten gefunden!");
          return;
        }

        document.getElementById("habe").value = data.habe.join(",");
        document.getElementById("suche").value = data.suche.join(",");
      }, { onlyOnce: true });
    };

    window.showMatches = function () {
      const matchDiv = document.getElementById("matches");
      matchDiv.innerHTML = "";

      onValue(ref(db, "users"), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const users = Object.values(data);

        users.forEach(userA => {
          users.forEach(userB => {
            if (userA !== userB) {
              userA.suche.forEach(sticker => {
                if (userB.habe.includes(sticker)) {
                  matchDiv.innerHTML += `
                    <div class="match">
                      ${userA.name} sucht ${sticker} → ${userB.name} hat es
                    </div>
                  `;
                }
              });
            }
          });
        });
      }, { onlyOnce: true });
    };
  </script>
</head>

<body>

  <div class="header">
    <img src="PXL_20260420_065327386.jpg" class="logo-big">
    <h2>Sticker Tauschbörse</h2>
    <div class="subtitle">GTV Baskets</div>
  </div>

  <input id="name" placeholder="Dein Name">
  <input id="habe" placeholder="Habe (z. B. 1,2,3)">
  <input id="suche" placeholder="Suche (z. B. 5,8,10)">

  <button onclick="saveData()">Speichern</button>
  <button onclick="loadMyData()">Meine Daten laden</button>
  <button onclick="showMatches()">Matches anzeigen</button>

  <div id="matches"></div>

  <!-- 👇 HIER ist dein Stickerbild ganz unten -->
  <img src="images (1).png" class="bottom-img">

</body>
</html>
