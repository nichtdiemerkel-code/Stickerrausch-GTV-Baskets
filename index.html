<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tausch Verein</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 16px;
}
</style>

</head>
<body>

<h1>Sticker Tausch Verein</h1>

<input id="name" placeholder="Dein Name">
<input id="password" type="password" placeholder="Passwort">
<input id="habe" placeholder="Habe (z.B. 1,2,3)">
<input id="suche" placeholder="Suche (z.B. 4,5,6)">

<button onclick="speichern()">Speichern</button>
<button onclick="laden()">Meine Daten laden</button>
<button onclick="anzeigen()">Matches anzeigen</button>

<div id="output"></div>

<script>

const BIN_ID = "69e539d3aaba882197179c9e";
const API_KEY = "$2a$10$HdFJ0LYvpk4dzcUyaf99HuRQV79zqoxn88z9jbfTjPrNcYKCiXHNq";

function sortiereListe(text) {
  return [...new Set(
    text.split(",")
    .map(x => parseInt(x.trim()))
    .filter(x => !isNaN(x))
  )].sort((a, b) => a - b);
}

async function speichern() {
  let name = document.getElementById("name").value;
  let password = document.getElementById("password").value;
  let habe = sortiereListe(document.getElementById("habe").value);
  let suche = sortiereListe(document.getElementById("suche").value);

  let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { "X-Master-Key": API_KEY }
  });

  let data = await res.json();
  let users = data.record.users || [];

  let existing = users.find(u => u.name === name);

  if (existing) {
    if (existing.password !== password) {
      alert("Falsches Passwort!");
      return;
    }

    existing.habe = habe;
    existing.suche = suche;
  } else {
    users.push({ name, password, habe, suche });
  }

  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify({ users })
  });

  alert("Gespeichert!");
}

async function laden() {
  let name = document.getElementById("name").value;
  let password = document.getElementById("password").value;

  let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { "X-Master-Key": API_KEY }
  });

  let data = await res.json();
  let users = data.record.users || [];

  let user = users.find(u => u.name === name);

  if (!user) {
    alert("Kein Benutzer gefunden");
    return;
  }

  if (user.password !== password) {
    alert("Falsches Passwort!");
    return;
  }

  document.getElementById("habe").value = user.habe.join(", ");
  document.getElementById("suche").value = user.suche.join(", ");
}

async function anzeigen() {
  let name = document.getElementById("name").value;
  let suche = sortiereListe(document.getElementById("suche").value);

  let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { "X-Master-Key": API_KEY }
  });

  let data = await res.json();
  let users = data.record.users || [];

  let output = "";

  users.forEach(user => {
    if (user.name !== name) {
      suche.forEach(s => {
        if (user.habe.includes(s)) {
          output += `<div>${user.name} hat deine Nummer ${s}</div>`;
        }
      });
    }
  });

  if (output === "") {
    output = "Keine Matches gefunden";
  }

  document.getElementById("output").innerHTML = output;
}

</script>

</body>
</html>
