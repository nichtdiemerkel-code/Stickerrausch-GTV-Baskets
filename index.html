<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 16px;
}

.logo {
  width: 80px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  background: #e30613;
  color: white;
}

.match {
  background: #e8f4ff;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
}

.sticker-img {
  width: 100%;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<img src="images (1).png" class="logo">

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Name (z.B. AnnaM)">
<input id="habe" placeholder="Habe (z.B. 1,5,23)">
<input id="suche" placeholder="Suche (z.B. 8,12,44)">

<button onclick="speichern()">Speichern</button>
<button onclick="laden()">Meine Daten laden</button>
<button onclick="matches()">Matches anzeigen</button>

<div id="output"></div>

<img src="PXL_20260420_065327386.jpg" class="sticker-img">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
  authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
  projectId: "gtv-baskets-stickertausch",
  storageBucket: "gtv-baskets-stickertausch.firebasestorage.app",
  messagingSenderId: "533155128539",
  appId: "1:533155128539:web:c309efb7827301617a98fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function parseListe(text) {
  return text.split(",")
    .map(x => parseInt(x.trim()))
    .filter(x => !isNaN(x));
}

window.speichern = async function() {
  const name = document.getElementById("name").value.trim();
  const habe = parseListe(document.getElementById("habe").value);
  const suche = parseListe(document.getElementById("suche").value);

  if (!name) return alert("Name fehlt!");

  await setDoc(doc(db, "users", name), { habe, suche });
  alert("Gespeichert!");
};

window.laden = async function() {
  const name = document.getElementById("name").value.trim();
  const docSnap = await getDoc(doc(db, "users", name));

  if (docSnap.exists()) {
    const data = docSnap.data();
    document.getElementById("habe").value = (data.habe || []).join(", ");
    document.getElementById("suche").value = (data.suche || []).join(", ");
  }
};

window.matches = async function() {
  const meinName = document.getElementById("name").value.trim();
  const meineSuche = parseListe(document.getElementById("suche").value);

  const querySnapshot = await getDocs(collection(db, "users"));
  let html = "";

  querySnapshot.forEach(docSnap => {
    const user = docSnap.data();
    const name = docSnap.id;

    if (name === meinName) return;

    const matches = (user.habe || []).filter(x => meineSuche.includes(x));

    if (matches.length > 0) {
      html += `<div class="match"><b>${name}</b> hat: ${matches.join(", ")}</div>`;
    }
  });

  document.getElementById("output").innerHTML = html || "Keine Matches gefunden";
};
</script>

</body>
</html>
