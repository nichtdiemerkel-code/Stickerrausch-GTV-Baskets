<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXjooJ3PldsrB8DHtzdlbbZXuwr8MC-qg",
    authDomain: "gtv-baskets-stickertausch.firebaseapp.com",
    projectId: "gtv-baskets-stickertausch",
    storageBucket: "gtv-baskets-stickertausch.firebasestorage.app",
    messagingSenderId: "533155128539",
    appId: "1:533155128539:web:c309efb7827301617a98fe"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function parseList(str) {
    return str.split(",").map(s => s.trim()).filter(Boolean).sort((a,b)=>a-b);
  }

  window.speichern = async function () {
    const name = document.getElementById("name").value.trim();
    const habe = parseList(document.getElementById("habe").value).join(",");
    const suche = parseList(document.getElementById("suche").value).join(",");

    if (!name) return alert("Bitte Namen eingeben");

    await addDoc(collection(db, "tausch"), { name, habe, suche });
    alert("Gespeichert!");
  };

  window.laden = async function () {
    const name = document.getElementById("name").value.trim();
    if (!name) return alert("Bitte Namen eingeben");

    const q = query(collection(db, "tausch"), where("name", "==", name));
    const snapshot = await getDocs(q);

    snapshot.forEach(doc => {
      const data = doc.data();
      document.getElementById("habe").value = data.habe;
      document.getElementById("suche").value = data.suche;
    });
  };

  window.matches = async function () {
    const meineSuche = parseList(document.getElementById("suche").value);
    const snapshot = await getDocs(collection(db, "tausch"));

    let output = "";

    snapshot.forEach(doc => {
      const data = doc.data();
      const habeListe = parseList(data.habe);

      meineSuche.forEach(num => {
        if (habeListe.includes(num)) {
          output += `<div class="match">${data.name} hat: ${num}</div>`;
        }
      });
    });

    document.getElementById("output").innerHTML = output || "Keine Matches gefunden";
  };
</script>
