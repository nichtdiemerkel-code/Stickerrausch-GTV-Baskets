<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.logo {
  width: 70px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
}

.match {
  background: #e8f4ff;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
}

.sticker-img {
  width: 100%;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<img src="images (1).png" class="logo">

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Name">
<input id="habe" placeholder="Habe">
<input id="suche" placeholder="Suche">

<button onclick="speichern()">Speichern</button>
<button onclick="laden()">Meine Daten laden</button>
<button onclick="matches()">Matches anzeigen</button>

<div id="output"></div>

<img src="PXL_20260420_065327386.jpg" class="sticker-img">

</div>

<script>
let daten = [];

function speichern() {
  const name = document.getElementById("name").value;
  const habe = document.getElementById("habe").value;
  const suche = document.getElementById("suche").value;

  daten.push({name, habe, suche});
  alert("Gespeichert (Testmodus)");
}

function laden() {
  const name = document.getElementById("name").value;
  const eintrag = daten.find(d => d.name === name);

  if (eintrag) {
    document.getElementById("habe").value = eintrag.habe;
    document.getElementById("suche").value = eintrag.suche;
  } else {
    alert("Nicht gefunden");
  }
}

function matches() {
  let meineSuche = document.getElementById("suche").value.split(",");
  let output = "";

  daten.forEach(d => {
    let habeListe = d.habe.split(",");
    meineSuche.forEach(s => {
      if (habeListe.includes(s.trim())) {
        output += `<div class="match">${d.name} hat ${s}</div>`;
      }
    });
  });

  document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
