<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sticker Tauschbörse</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
}

button {
  background: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
}

.match {
  background: #e9f5ff;
  padding: 8px;
  margin: 6px 0;
  border-radius: 5px;
}
</style>
</head>
<body>

<h2>Sticker Tauschbörse</h2>

<input id="name" placeholder="Dein Name">
<input id="habe" placeholder="Ich habe (z.B. 1,2,3)">
<input id="suche" placeholder="Ich suche (z.B. 4,5,6)">

<button onclick="speichern()">Eintragen / Aktualisieren</button>
<button onclick="anzeigen()">Matches anzeigen</button>

<div id="output"></div>

<script>

const BIN_ID = "69e539d3aaba882197179c9e";
const API_KEY = "$2a$10$HdFJ0LYvpk4dzcUyaf99HuRQV79zqoxn88z9jbfTjPrNcYKCiXHNq";

// Liste verarbeiten
function liste(text) {
  return text.split(",")
    .map(x => parseInt(x.trim()))
    .filter(x => !isNaN(x))
    .sort((a,b)=>a-b);
}

// Daten laden
async function ladeAlle() {
  let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { "X-Master-Key": API_KEY }
  });

  let data = await res.json();
  return data.record.users || [];
}

// Speichern (überschreibt eigenen Eintrag)
async function speichern() {
  let name = document.getElementById("name").value.trim();
  let habe = liste(document.getElementById("habe").value);
  let suche = liste(document.getElementById("suche").value);

  if (!name) {
    alert("Bitte Namen eingeben");
    return;
  }

  let users = await ladeAlle();

  let idx = users.findIndex(u => u.name === name);

  if (idx !== -1) {
    users[idx] = { name, habe, suche };
  } else {
    users.push({ name, habe, suche });
  }

  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify({ users })
  });

  alert("Gespeichert!");
}

// Matches anzeigen
async function anzeigen() {
  let meinName = document.getElementById("name").value.trim();
  let meineSuche = liste(document.getElementById("suche").value);

  let users = await ladeAlle();

  let html = "";

  users.forEach(u => {
    if (u.name === meinName) return;

    let treffer = meineSuche.filter(n => u.habe.includes(n));

    if (treffer.length > 0) {
      html += `<div class="match"><b>${u.name}</b> hat: ${treffer.join(", ")}</div>`;
    }
  });

  document.getElementById("output").innerHTML =
    html || "Keine Matches gefunden";
}

</script>

</body>
</html>
